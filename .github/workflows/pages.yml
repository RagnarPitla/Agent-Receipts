# Deploys the landing page to GitHub Pages.
#
# SITE DIRECTORY: this repository publishes `site/`, because `docs/` was
# already taken by Markdown documentation. The directory name appears in four
# places below and Actions does not expand env vars in a `paths:` filter, so
# changing it means editing all four by hand. Because deployment goes through
# upload-pages-artifact rather than the "Pages from a branch" setting, the
# directory name is a free choice.
#
# ONE-TIME SETUP, which cannot be done from a workflow file: open the
# repository Settings -> Pages and set Source to "GitHub Actions". Until that
# is set this workflow runs green and publishes nothing, which is the most
# confusing failure mode in the whole pipeline.
#
# site/index.html is generated from tools/index.template.html by site/fill.py
# and is committed. The ci.yml workflow fails if the committed file has drifted
# from what the generator produces, so this one can publish the file as-is.
#
# The site is dependency-free static HTML, so there is no build step: the job
# validates, then uploads the directory unchanged.

name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"                        # (1) site directory
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the page before publishing it
        run: python3 site/validate.py site   # (2) and (3) site directory

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site                       # (4) site directory
      - id: deployment
        uses: actions/deploy-pages@v4
