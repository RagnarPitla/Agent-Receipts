# Deploys the landing page to GitHub Pages.
#
# SITE DIRECTORY: this file assumes `docs/`. If the repository already uses
# docs/ for Markdown documentation, switch to `site/` (or anything else) and
# change it in all four places below: the two `paths:` entries are matched
# literally, and Actions does not expand env vars in a `paths:` filter, so a
# find-and-replace is the only safe edit. Because deployment goes through
# upload-pages-artifact rather than the "Pages from a branch" setting, the
# directory name is a completely free choice.
#
# ONE-TIME SETUP, which cannot be done from a workflow file: open the
# repository Settings -> Pages and set Source to "GitHub Actions". Until that
# is set this workflow runs green and publishes nothing, which is the most
# confusing failure mode in the whole pipeline.
#
# The site is dependency-free static HTML, so there is no build step: the job
# validates, then uploads the directory as-is.

name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"                        # (1) site directory
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the page before publishing it
        run: python3 site/validate.py site   # (2) and (3) site directory

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site                       # (4) site directory
      - id: deployment
        uses: actions/deploy-pages@v4
